version: '3.8'

services:
  mysql_db:
    image: mariadb:10.11
    container_name: lidar_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: lidar_root_pass
      MYSQL_DATABASE: lidar_network
      MYSQL_USER: lidar_user
      MYSQL_PASSWORD: lidar_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
